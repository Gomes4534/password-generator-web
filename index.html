<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/styles/reset.css">
    <link rel="stylesheet" href="./src/styles/style.css">
    <link rel="stylesheet" href="./src/scripts/script.js">
    <title>Gerador de senha</title>
</head>

<body>
    <main>
        <div class="card">

            <header>
                <h1>Gerador de senhas</h1>
            </header>

            <section class="length">
                <label for="number">Comprimento: </label>
                <input type="number" name="" id="number">
            </section>

            <section class="options">

                <div class="option">
                    <input type="checkbox" name="" id="maiusculas">
                    <label for="maiusculas">Maiúsculas</label>
                </div>

                <div class="option">
                    <input type="checkbox" name="" id="minusculas">
                    <label for="minusculas">Minúsculas</label>
                </div>

                <div class="option">
                    <input type="checkbox" name="" id="especiais">
                    <label for="especiais">Caracteres especiais</label>
                </div>

                <div class="option">
                    <input type="checkbox" name="" id="numeros">
                    <label for="numeros">Números</label>
                </div>
            </section>

            <section class="generate">
                <button>Gerar senha</button>
            </section>

            <section class="result">
                <p>Senha gerada: </p>

                <div class="password">
                    Gerando senha...
                </div>

                <button>Copiar</button>
            </section>

        </div>
    </main>
</body>

</html>
