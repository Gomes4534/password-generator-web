<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de senha</title>
    <link rel="stylesheet" href="./src/styles/reset.css">
    <link rel="stylesheet" href="./src/styles/style.css">
</head>

<body>
    <div class="card">
        <h1>Gerador de senha</h1>

        <div class="marcadores">
            <label> Letras Maiúsculas: </label>
            <input type="checkbox" name="" id="maiusculas">

            <label> Letas Minúsculas: </label>
            <input type="checkbox" name="" id="minusculas">

            <label>Caractéres especias: </label>
            <input type="checkbox" name="" id="especiais">

            <label>Números: </label>
            <input type="checkbox" name="" id="numeros">
        </div>


        <div class="campo-senha">
            <button id="gerador">Gerar senha</button>
            <input type="text" readonly id="senha">
            <button id="copiar">copiar</button>
        </div>

    </div>
    <script src="./src/scripts/script.js"></script>
</body>

</html>
